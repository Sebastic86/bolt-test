server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing (/, /matches, /admin) — anything
    # not a real static file falls back to index.html, or refreshing on a
    # sub-route would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Home screen app: the service worker and manifest must never be cached
    # (the 7-day immutable rule below would otherwise apply to sw.js).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
